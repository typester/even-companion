[package]
name = "evencore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "evencore"

[dependencies]
uniffi = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
